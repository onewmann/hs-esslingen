name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[test,video]"
      - name: Test
        run: python -m pytest -q tests/python
      - name: Experiments (small subset, outside the repository)
        run: |
          python experiments/run.py --quick --only pipeline testsequences before_after --out "${{ runner.temp }}/exp"
          python experiments/real_measurements.py data/measurements/synthetic_average/meta.csv --out "${{ runner.temp }}/measurements/average.csv" --figure "${{ runner.temp }}/measurements/average.png"
          python experiments/real_measurements.py data/measurements/synthetic_flash/meta.csv --out "${{ runner.temp }}/measurements/results.csv" --figure "${{ runner.temp }}/measurements/results.png"
          python data/measurements/2026-10-16_phone_120fps/extract_frames.py --out "${{ runner.temp }}/phone"
          python experiments/real_measurements.py "${{ runner.temp }}/phone/meta.csv" --jobs 4 --figure "${{ runner.temp }}/phone/results.png"
          python data/measurements/2026-10-17_phone_grid/extract_frames.py --out "${{ runner.temp }}/grid"
          python experiments/real_measurements.py "${{ runner.temp }}/grid/meta.csv" --jobs 4 --figure "${{ runner.temp }}/grid/results.png"
          python data/measurements/2026-10-17_phone_grid/directions.py "${{ runner.temp }}/grid"

  octave:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave xvfb libgl1-mesa-dri fonts-freefont-otf
      - name: Test (same suite as for MATLAB)
        run: octave --no-gui --eval "cd tests/matlab; run_tests"
      - name: Demos (figures on a virtual display)
        run: |
          xvfb-run -a octave --no-gui --eval "run('matlab/examples/demo_simulation.m'); drawnow"
          xvfb-run -a octave --no-gui --eval "run('matlab/examples/demo_testsequences.m'); drawnow"

  matlab:
    # MATLAB without a licence on public repositories; a private repository needs a
    # batch licensing token (see the documentation of matlab-actions/setup-matlab)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - name: Test (same suite as for Octave)
        uses: matlab-actions/run-command@v3
        with:
          command: cd tests/matlab; run_tests
      - name: Demos
        uses: matlab-actions/run-command@v3
        with:
          command: run('matlab/examples/demo_simulation.m'); run('matlab/examples/demo_testsequences.m'); drawnow
      - name: Code analyser (no errors, live_basler.m included)
        uses: matlab-actions/run-command@v3
        with:
          command: f = dir('matlab/**/*.m'); issues = codeIssues(fullfile({f.folder}, {f.name})); disp(issues.Issues(:, {'Severity', 'FullFilename', 'LineStart', 'Description'})); assert(~any(issues.Issues.Severity == 'error'), 'code analyser errors')
