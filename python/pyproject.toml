[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fftvel"
version = "0.1.0"
description = "Surface velocity from averaged camera frames or a single multi-flash image (2-D FFT and Radon transform)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Oliver Neumann"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]
keywords = ["frame averaging", "multi-flash", "velocimetry", "speed over ground", "velocity measurement",
            "machine vision", "FFT", "Radon transform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/onewmann/2D-FFT-Code"
Documentation = "https://github.com/onewmann/2D-FFT-Code#readme"
Issues = "https://github.com/onewmann/2D-FFT-Code/issues"

[project.scripts]
fftvel = "fftvel.__main__:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
data = ["scipy>=1.7", "h5py>=3.6", "pillow>=8.4"]
video = ["opencv-python-headless>=4.5"]
examples = ["matplotlib>=3.6", "scipy>=1.7", "h5py>=3.6", "pillow>=8.4", "opencv-python-headless>=4.5"]
test = ["pytest>=7", "scipy>=1.7", "matplotlib>=3.6", "h5py>=3.6", "pillow>=8.4", "tifffile>=2021.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
