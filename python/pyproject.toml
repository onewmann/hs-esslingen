[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fftvel"
version = "1.0.0"
description = "Velocity of a moving texture from a single pulsed-exposure image (2-D FFT + Radon)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Oliver Neumann"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
data = ["scipy>=1.7"]
video = ["opencv-python-headless>=4.5"]
examples = ["matplotlib>=3.5", "scipy>=1.7", "opencv-python-headless>=4.5"]
test = ["pytest>=7", "scipy>=1.7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
