[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fftvel"
version = "0.1.0"
description = "Velocity of a moving texture from a single pulsed-exposure image (2-D FFT + Radon)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Oliver Neumann"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
data = ["scipy>=1.7", "h5py>=3.6", "pillow>=8.4"]
video = ["opencv-python-headless>=4.5"]
examples = ["matplotlib>=3.6", "scipy>=1.7", "h5py>=3.6", "pillow>=8.4", "opencv-python-headless>=4.5"]
test = ["pytest>=7", "scipy>=1.7", "matplotlib>=3.6", "h5py>=3.6", "pillow>=8.4", "tifffile>=2021.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
